<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="French Cards">
<meta name="theme-color" content="#1a3a6b">
<link rel="manifest" href="./manifest.json">

<title>French Flashcards — Leçons avec Josefa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a3a6b, #2d6a9f);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; }

  .tabs {
    display: flex;
    overflow-x: auto;
    background: white;
    border-bottom: 2px solid #e8edf2;
    padding: 0 12px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 14px;
    cursor: pointer;
    border: none;
    background: none;
    font-size: 0.82rem;
    white-space: nowrap;
    color: #777;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tab.active { color: #2d6a9f; border-bottom-color: #2d6a9f; font-weight: 700; }
  .tab:hover { color: #2d6a9f; }

  .main { max-width: 580px; margin: 0 auto; padding: 20px 16px 32px; }

  .progress-section {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .progress-bar { flex: 1; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: #48bb78; border-radius: 4px; transition: width 0.4s ease; }
  .progress-text { font-size: 0.8rem; color: #888; white-space: nowrap; min-width: 70px; text-align: right; }

  .card-container {
    perspective: 1200px;
    height: 300px;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
  }
  .card {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.06);
  }
  .card-front { background: white; }
  .card-back { background: linear-gradient(145deg, #1a3a6b, #2d6a9f); color: white; transform: rotateY(180deg); }

  .card-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .card-front .card-label { color: #bbc8d4; }
  .card-back .card-label { color: rgba(255,255,255,0.55); }

  .card-main {
    font-size: 1.95rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.25;
    word-break: break-word;
  }
  .card-front .card-main { color: #1a2d4a; }

  .card-sub {
    margin-top: 12px;
    font-size: 0.82rem;
    text-align: center;
    line-height: 1.55;
    opacity: 0.78;
    font-style: italic;
    max-width: 100%;
  }

  .flip-hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.72rem;
    color: #c8d5e0;
    letter-spacing: 0.5px;
  }

  .known-badge {
    margin-top: 10px;
    font-size: 0.75rem;
    color: #48bb78;
    font-weight: 600;
  }

  .cat-badge {
    position: absolute;
    bottom: 14px;
    font-size: 0.7rem;
    background: rgba(255,255,255,0.15);
    padding: 3px 10px;
    border-radius: 50px;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
  }
  .nav-btn {
    background: white;
    border: 1.5px solid #dde4ec;
    border-radius: 50px;
    padding: 9px 22px;
    cursor: pointer;
    font-size: 0.9rem;
    color: #555;
    transition: all 0.2s;
    font-family: inherit;
  }
  .nav-btn:hover { border-color: #2d6a9f; color: #2d6a9f; background: #f0f6ff; }
  .nav-btn:active { transform: scale(0.97); }
  .card-counter { font-size: 0.85rem; color: #999; }

  .action-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .btn-action {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-gotit { background: #f0fff4; color: #276749; border: 1.5px solid #9ae6b4; }
  .btn-gotit:hover { background: #48bb78; color: white; border-color: #48bb78; }
  .btn-again { background: #fff5f5; color: #9b2c2c; border: 1.5px solid #feb2b2; }
  .btn-again:hover { background: #e53e3e; color: white; border-color: #e53e3e; }
  .btn-action:active { transform: scale(0.97); }

  .controls-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 7px 14px;
    border: 1.5px solid #dde4ec;
    border-radius: 50px;
    background: white;
    cursor: pointer;
    font-size: 0.78rem;
    color: #666;
    transition: all 0.2s;
    font-family: inherit;
  }
  .ctrl-btn:hover { background: #f0f6ff; border-color: #2d6a9f; color: #2d6a9f; }
  .ctrl-btn.active { background: #2d6a9f; color: white; border-color: #2d6a9f; }

  .keyboard-hint {
    margin-top: 18px;
    font-size: 0.72rem;
    color: #bbb;
    text-align: center;
  }
  kbd {
    background: #f0f4f8;
    border: 1px solid #dde4ec;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.7rem;
    color: #888;
    font-family: inherit;
  }

  @media (max-width: 480px) {
    .card-main { font-size: 1.5rem; }
    .card-container { height: 270px; }
  }
</style>
</head>
<body>

<header>
  <h1>🇫🇷 French Flashcards — Leçons avec Josefa</h1>
  <span style="font-size:1.3rem">✨</span>
</header>

<div class="tabs" id="tabs"></div>

<div class="main">
  <div class="progress-section">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="progressText">0 / 0 known</span>
  </div>

  <div class="card-container" onclick="flipCard()" id="cardContainer">
    <div class="card" id="card">
      <div class="card-face card-front" id="cardFront"></div>
      <div class="card-face card-back" id="cardBack"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" onclick="prevCard()">← Prev</button>
    <span class="card-counter" id="cardCounter">1 / 1</span>
    <button class="nav-btn" onclick="nextCard()">Next →</button>
  </div>

  <div class="action-row">
    <button class="btn-action btn-gotit" onclick="markKnown()">✓ Got it!</button>
    <button class="btn-action btn-again" onclick="markAgain()">↩ Study again</button>
  </div>

  <div class="controls-row">
    <button class="ctrl-btn" onclick="shuffleCards()">🔀 Shuffle</button>
    <button class="ctrl-btn" id="reviewBtn" onclick="toggleReviewMode()">📚 Unknowns only</button>
    <button class="ctrl-btn" id="flipDefaultBtn" onclick="toggleFlipDefault()">🔄 Show French first</button>
    <button class="ctrl-btn" onclick="resetProgress()">↺ Reset</button>
  </div>

  <div class="keyboard-hint">
    <kbd>Space</kbd> flip &nbsp;·&nbsp; <kbd>→</kbd> next &nbsp;·&nbsp; <kbd>←</kbd> prev &nbsp;·&nbsp; <kbd>Enter</kbd> mark known
  </div>
</div>

<script>
const categories = [

    cards: [

      { front: 'to think', back: 'penser', sub: 'je pense · tu penses · il/elle pense\nnous pensons · vous pensez · ils/elles pensent' },
      { front: 'to like / to love', back: 'aimer', sub: 'j\'aime · tu aimes · il/elle aime\nnous aimons · vous aimez · ils/elles aiment' },

  {

    cards: [
      { front: 'England', back: 'l\'Angleterre', sub: 'feminine' },
      { front: 'France', back: 'la France', sub: 'feminine' },
      { front: 'Spain', back: 'l\'Espagne', sub: 'feminine' },
      { front: 'Italy', back: 'l\'Italie', sub: 'feminine' },
      { front: 'Germany', back: 'l\'Allemagne', sub: 'feminine · L-A-lle-ma-gne (4 syllables)' },
      { front: 'Japan', back: 'le Japon', sub: 'masculine' },
    ]
  },
  {
    id: 'languages', name: '🗣️ Languages',
    cards: [
      { front: 'English (language)', back: 'l\'anglais', sub: 'Je parle anglais\n⚠ No article after parler / penser' },
      { front: 'French (language)', back: 'le français', sub: 'Je parle français' },
      { front: 'Spanish (language)', back: 'l\'espagnol', sub: 'Je parle espagnol' },
      { front: 'Italian (language)', back: 'l\'italien', sub: 'Je parle italien' },
      { front: 'German (language)', back: 'l\'allemand', sub: 'L-A-lle-mand (3 syllables)' },
      { front: 'Japanese (language)', back: 'le japonais', sub: 'Je parle japonais' },
    ]
  },
  {
    id: 'nationalities', name: '🏳️ Nationalities',
    cards: [
      { front: 'English (nationality)', back: 'anglais / anglaise', sub: 'anglais (m) · anglaise (f)\nanglais (m.pl) · anglaises (f.pl)' },
      { front: 'French (nationality)', back: 'français / française', sub: 'français (m) · française (f)\nfrançais (m.pl) · françaises (f.pl)' },
      { front: 'Spanish (nationality)', back: 'espagnol / espagnole', sub: 'espagnol (m) · espagnole (f)\nespagnols (m.pl) · espagnoles (f.pl)' },
      { front: 'Italian (nationality)', back: 'italien / italienne', sub: 'italien (m) · italienne (f)\n⚠ double n in feminine!\nitaliens (m.pl) · italiennes (f.pl)' },
      { front: 'German (nationality)', back: 'allemand / allemande', sub: 'allemand (m) · allemande (f)\nallemands (m.pl) · allemandes (f.pl)' },
      { front: 'Japanese (nationality)', back: 'japonais / japonaise', sub: 'japonais (m) · japonaise (f)\njaponais (m.pl) · japonaises (f.pl)' },

  {
    id: 'days', name: '📅 Days',

    cards: [

      { front: 'March', back: 'mars' },
      { front: 'April', back: 'avril' },
      { front: 'May', back: 'mai' },
      { front: 'June', back: 'juin', sub: '🔊 sounds like: juun (short u)' },
      { front: 'July', back: 'juillet', sub: '🔊 jui-ill (y like yellow)' },
      { front: 'August', back: 'août', sub: '🔊 sounds like: Oot' },
      { front: 'September', back: 'septembre' },
      { front: 'October', back: 'octobre' },
      { front: 'November', back: 'novembre' },
      { front: 'December', back: 'décembre' },
    ]
  },
  {
    id: 'seasons', name: '🌸 Seasons',
    cards: [
      { front: 'Autumn', back: 'l\'automne', sub: '🔊 l\'oton' },
      { front: 'Winter', back: 'l\'hiver' },
      { front: 'Spring', back: 'le printemps', sub: '🔊 Prunt+en (silent ps)' },
      { front: 'Summer', back: 'l\'été' },
    ]
  },
  {
    id: 'clothes', name: '👗 Clothes',
    cards: [
      { front: 'a shirt', back: 'une chemise', sub: 'feminine · J\'ai une chemise' },
      { front: 'a pullover / jumper', back: 'un pull', sub: 'masculine · J\'ai un pull' },
      { front: 'a T-shirt', back: 'un T-shirt', sub: 'masculine' },
      { front: 'a top', back: 'un top', sub: 'masculine' },
      { front: 'a jacket', back: 'une veste', sub: 'feminine' },
      { front: 'jeans', back: 'un jean', sub: 'masculine' },
      { front: 'trousers', back: 'un pantalon', sub: 'masculine' },
      { front: 'a skirt', back: 'une jupe', sub: 'feminine' },
      { front: 'a dress', back: 'une robe', sub: 'feminine' },
      { front: 'boots', back: 'des bottes', sub: 'feminine plural' },
      { front: 'trainers / sneakers', back: 'des baskets', sub: 'feminine plural' },
      { front: 'shoes', back: 'des chaussures', sub: 'feminine plural' },
    ]
  },
  {
    id: 'colours', name: '🎨 Colours',
    cards: [
      { front: 'beige', back: 'beige', sub: '✓ Never changes: beige (m/f/pl)' },
      { front: 'white', back: 'blanc / blanche', sub: 'blanc (m) · blanche (f)\nblancs (m.pl) · blanches (f.pl)' },
      { front: 'blue', back: 'bleu / bleue', sub: 'bleu (m) · bleue (f)\nbleus (m.pl) · bleues (f.pl)' },
      { front: 'brown', back: 'marron', sub: '✓ Never changes: marron (m/f/pl)' },
      { front: 'grey', back: 'gris / grise', sub: 'gris (m) · grise (f)\ngris (m.pl) · grises (f.pl)' },
      { front: 'yellow', back: 'jaune', sub: 'jaune (m/f) · jaunes (pl)' },
      { front: 'black', back: 'noir / noire', sub: 'noir (m) · noire (f)\nnoirs (m.pl) · noires (f.pl)' },
      { front: 'orange', back: 'orange', sub: '✓ Never changes: orange (m/f/pl)' },
      { front: 'pink', back: 'rose', sub: 'rose (m/f) · roses (pl)' },
      { front: 'red', back: 'rouge', sub: 'rouge (m/f) · rouges (pl)' },
      { front: 'green', back: 'vert / verte', sub: 'vert (m) · verte (f)\nverts (m.pl) · vertes (f.pl)' },
      { front: 'purple', back: 'violet / violette', sub: 'violet (m) · violette (f)\n⚠ double t in feminine!\nviolets (m.pl) · violettes (f.pl)' },
    ]
  },
  {
    id: 'grammar', name: '📝 Grammar',
    cards: [
      { front: '-er verb endings\n(present tense)', back: 'je→ -e · tu→ -es · il/elle→ -e\nnous→ -ons · vous→ -ez · ils/elles→ -ent', sub: 'The ending -s is NEVER pronounced\nje parle = tu parles = il parle (same sound)' },
      { front: 'The NEGATIVE form', back: 'NE + verb + PAS', sub: 'Je ne parle pas français.\nTu ne penses pas en japonais.\n⚠ ne → n\' before a vowel:\nNous n\'aimons pas l\'Allemagne.' },
      { front: 'The INTERROGATIVE form\n(standard)', back: 'Est-ce que + affirmative sentence?', sub: 'Est-ce que vous parlez français?\nEst-ce qu\'elle s\'appelle Sarah?\n⚠ que → qu\' before a vowel' },
      { front: 'Answering NO in French', back: 'Non + NE...PAS (double negative)', sub: 'Non, je ne suis pas français.\nNon, je ne parle pas espagnol.' },
      { front: 'TU vs VOUS', back: 'TU = singular informal (1 person you know)\nVOUS = plural OR polite/formal', sub: 'se tutoyer = using tu\nse vouvoyer = using vous\nSame conjugation for polite & plural vous' },
      { front: 'Liaison — when does it happen?', back: 'Word ending in consonant + next word starting with a vowel', sub: 'nous aimons (s→a)\nvous aimez (s→a)\nils aiment (s→a)\nelles aiment (s→a)' },
      { front: 'Feminine nationality — rule', back: 'Add -e to the masculine form', sub: 'français → française\nespagnol → espagnole\nallemand → allemande\n⚠ Exception: italien → italienne (double n)' },
      { front: 'Article before language names?', back: 'NO article after parler or penser', sub: 'Je parle français ✓\nJe parle le français ✗\nJe pense en français ✓\n(use EN to mean "in" a language)' },
      { front: 'S\'appeler — special notes', back: 'Reflexive verb: needs a reflexive pronoun', sub: 'je m\'appelle · tu t\'appelles · il/elle s\'appelle\nNOUS/VOUS form: only ONE l\nnous nous appelons · vous vous appelez' },
      { front: 'Masculine / Feminine plural form', back: 'Add -s to the singular form', sub: 'français → français (m.pl — same!)\nfrançaise → françaises (f.pl)\n⚠ Plural -s is NEVER pronounced\nitalien → italiens (m.pl)' },
      { front: 'C\'EST — how to say "it is"', back: 'c\'est + noun', sub: 'C\'est mardi. C\'est février. C\'est l\'hiver.\nToday = Aujourd\'hui c\'est mardi\nNow = Maintenant c\'est l\'hiver' },
      { front: 'CE N\'EST PAS — "it is not"', back: 'ce n\'est pas + noun', sub: 'Ce n\'est pas lundi. Ce n\'est pas janvier.\n⚠ With seasons add article:\nCe n\'est pas l\'été. Ce n\'est pas le printemps.' },
      { front: 'IL Y A — "there is / there are"', back: 'Il y a + noun', sub: 'Il y a une grande table dans la cuisine.\nIl y a six chambres.\nNEGATIVE: Il n\'y a pas de + noun' },
      { front: 'CHEZ — at someone\'s place', back: 'chez + person/professional', sub: 'Je vais chez Sarah. (I\'m going to Sarah\'s)\nChez le boulanger. (at the baker\'s)\nChez le docteur. (at the doctor\'s)' },
      { front: 'ON — informal "we"', back: 'ON = informal NOUS in spoken French\nConjugates like IL/ELLE', sub: 'On aime... On a... On est... On parle...\nOn va en France. (we\'re going to France)\nOn achète du pain. (we buy bread)' },
      { front: 'Prepositions for COUNTRIES', back: 'EN + feminine country\nAU + masculine country\nAUX + plural country', sub: 'en France, en Espagne, en Allemagne\nau Japon, au Mexique, au Portugal\naux États-Unis, aux Pays-Bas' },
      { front: 'Prepositions for CITIES', back: 'À + city name', sub: 'à Paris, à Limoges, à Londres\n⚠ Exception: LE MANS → au Mans\n(compound name starting with LE → use AU)' },
      { front: 'Seasons: which preposition?', back: 'EN for most seasons\nAU for spring only', sub: 'en été · en automne · en hiver\nBUT: au printemps ⚠' },
      { front: 'DU / DE LA / DE L\' / DES — "some"', back: 'du (masc) · de la (fem) · de l\' (vowel) · des (plural)', sub: 'du fromage · du vin · du pain\nde la soupe · de la viande\nde l\'eau · des légumes\n⚠ After NEGATIVE → just DE / D\'' },
      { front: 'À + article = AU / À LA / AUX\n("to the" / "at the")', back: 'à + le = AU · à + la = À LA\nà + l\' = À L\' · à + les = AUX', sub: 'au supermarché · à la maison\nà l\'hôtel · aux États-Unis' },
      { front: 'CHAQUE vs TOUS/TOUTES\n("each" vs "every")', back: 'CHAQUE = each (always singular, more formal)\nTOUS/TOUTES = every (agrees with noun)', sub: 'chaque jour = each day (formal)\ntous les jours = every day (common)\ntoutes les semaines = every week\ntous les matins = every morning' },

  {

let currentCatIndex = 0;
let currentCardIndex = 0;
let isFlipped = false;
let knownCards = {};
let reviewModeOnly = false;
let showFrenchFirst = false;
let currentDeck = [];

function buildDeck() {
  const cat = categories[currentCatIndex];
  let pool = cat.cards.map((c, i) => ({ ...c, origIndex: i }));
  if (reviewModeOnly) {
    const filtered = pool.filter(c => !knownCards[cat.id + '_' + c.origIndex]);
    pool = filtered.length > 0 ? filtered : pool;
  }
  currentDeck = pool;
  currentCardIndex = 0;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = categories.map((c, i) =>
    `<button class="tab ${i === currentCatIndex ? 'active' : ''}" onclick="switchCategory(${i})">${c.name}</button>`
  ).join('');
}

function renderCard() {
  if (!currentDeck.length) return;
  const card = currentDeck[currentCardIndex];
  const cat = categories[currentCatIndex];
  const key = cat.id + '_' + card.origIndex;
  const isKnown = !!knownCards[key];

  const A = showFrenchFirst ? card.back : card.front;
  const B = showFrenchFirst ? card.front : card.back;
  const labelA = showFrenchFirst ? 'Français' : 'English';
  const labelB = showFrenchFirst ? 'English' : 'Français';

  document.getElementById('cardFront').innerHTML =
    `<div class="card-label">${labelA}</div>
     <div class="card-main">${esc(A)}</div>
     ${isKnown ? '<div class="known-badge">✓ Known</div>' : ''}
     <div class="flip-hint">tap to reveal →</div>`;

  const subHtml = card.sub ? `<div class="card-sub">${esc(card.sub).replace(/\n/g, '<br>')}</div>` : '';
  document.getElementById('cardBack').innerHTML =
    `<div class="card-label">${labelB}</div>
     <div class="card-main">${esc(B)}</div>
     ${subHtml}
     <div class="cat-badge">${cat.name}</div>`;

  const cardEl = document.getElementById('card');
  cardEl.classList.remove('flipped');
  isFlipped = false;

  document.getElementById('cardCounter').textContent = `${currentCardIndex + 1} / ${currentDeck.length}`;
  updateProgress();
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgress() {
  const cat = categories[currentCatIndex];
  const total = cat.cards.length;
  const known = cat.cards.filter((_, i) => knownCards[cat.id + '_' + i]).length;
  const pct = total > 0 ? (known / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${known} / ${total} known`;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (!currentDeck.length) return;
  currentCardIndex = (currentCardIndex + 1) % currentDeck.length;
  renderCard();
}

function prevCard() {
  if (!currentDeck.length) return;
  currentCardIndex = (currentCardIndex - 1 + currentDeck.length) % currentDeck.length;
  renderCard();
}

function markKnown() {
  if (!currentDeck.length) return;
  const card = currentDeck[currentCardIndex];
  const cat = categories[currentCatIndex];
  knownCards[cat.id + '_' + card.origIndex] = true;
  save();
  nextCard();
}

function markAgain() {
  if (!currentDeck.length) return;
  const card = currentDeck[currentCardIndex];
  const cat = categories[currentCatIndex];
  delete knownCards[cat.id + '_' + card.origIndex];
  save();
  nextCard();
}

function shuffleCards() {
  for (let i = currentDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
  }
  currentCardIndex = 0;
  renderCard();
}

function toggleReviewMode() {
  reviewModeOnly = !reviewModeOnly;
  document.getElementById('reviewBtn').classList.toggle('active', reviewModeOnly);
  buildDeck();
  renderCard();
}

function toggleFlipDefault() {
  showFrenchFirst = !showFrenchFirst;
  const btn = document.getElementById('flipDefaultBtn');
  btn.textContent = showFrenchFirst ? '🔄 Show English first' : '🔄 Show French first';
  btn.classList.toggle('active', showFrenchFirst);
  renderCard();
}

function resetProgress() {
  const cat = categories[currentCatIndex];
  cat.cards.forEach((_, i) => delete knownCards[cat.id + '_' + i]);
  save();
  buildDeck();
  renderCard();
}

function switchCategory(i) {
  currentCatIndex = i;
  renderTabs();
  buildDeck();
  renderCard();
}

function save() {
  try { localStorage.setItem('jf_flashcards', JSON.stringify(knownCards)); } catch(e) {}
}
function load() {
  try { const s = localStorage.getItem('jf_flashcards'); if (s) knownCards = JSON.parse(s); } catch(e) {}
}

load();
renderTabs();
buildDeck();
renderCard();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 'Enter') markKnown();
});

// PWA: register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('SW registered'))
      .catch(e => console.log('SW error:', e));
  });
}

// PWA: install prompt banner
let deferredPrompt;
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');
const dismissBtn = document.getElementById('dismissBtn');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.style.display = 'flex';
});

installBtn && installBtn.addEventListener('click', async () => {
  installBanner.style.display = 'none';
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
});

dismissBtn && dismissBtn.addEventListener('click', () => {
  installBanner.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installBanner.style.display = 'none';
});
</script>
